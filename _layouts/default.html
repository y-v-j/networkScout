<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#191926">
  {% seo %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/FantasqueSansMono-Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.github.build_revision }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="networkScout home">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5.1 3.4 9.7 8 11 4.6-1.3 8-5.9 8-11V5l-8-3z"/><path class="tick" d="m8.5 12 2.4 2.4 4.6-4.8"/></svg>
        <span class="brand-name">networkScout</span>
      </a>
      <span class="brand-sub">Linux security &amp; privacy check-up</span>
      <nav class="topnav" aria-label="Main">
        <a href="#installation">Install</a>
        <a href="#the-desktop-app">App</a>
        <a href="#command-line-usage">CLI</a>
        <a class="chip" href="{{ site.github.repository_url }}">GitHub</a>
      </nav>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="Sections"><nav id="toc"></nav></aside>
    <main id="content" class="content">
{{ content }}
    </main>
  </div>

  <footer class="footer">
    <span>networkScout &middot; MIT licence &middot; &copy; 2026 Yogesh</span>
    <span class="sep" aria-hidden="true">&bull;</span>
    <span>screenshots: demo mode, invented data</span>
    <span class="sep" aria-hidden="true">&bull;</span>
    <a href="{{ site.github.repository_url }}">source on GitHub</a>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.github.build_revision }}" defer></script>
</body>
</html>
